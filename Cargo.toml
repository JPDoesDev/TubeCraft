[workspace]
resolver = "2"
members = ["tubecraft-plugin", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JPDoesDev/TubeCraft"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
